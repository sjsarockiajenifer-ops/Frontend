<!DOCTYPE html>
<html>

<head>
    <title>CSS Classroom Details</title>

    <style>

        .tittle {
            background-color: lightgray;
            color: black;
        }

        .section {
            background-color: rgb(196, 208, 212);
            color: black;
        }

        .student {
            background-color: lightgreen;
            color: black;
        }

        .topic {
            background-color: rgb(183, 183, 61);
            color: black;
        }

    </style>

</head>

<body>

    <h1 class="tittle">CSS Classroom Details</h1>

    <section class="tittle">

        <h2>CSS Class</h2>

        <p>Teacher Information</p>
        <p>Teacher Name</p>
        <p>Subject</p>

    </section>


    <section class="section">

        <h2>Student Information</h2>

        <p>Arun</p>
        <p>Priya</p>
        <p>Kumar</p>
        <p>Divya</p>

    </section>


    <section class="student">

        <h2>Today's Topics</h2>

        <p>HTML</p>
        <p>CSS</p>
        <p>JavaScript</p>

    </section>


    <section class="topic">

        <h2>Class Status</h2>

        <p>Class Started</p>
        <p>Class In Progress</p>
        <p>Class Completed</p>

    </section>

</body>

</html>
